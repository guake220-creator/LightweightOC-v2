name: Build OS

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm build-essential

    - name: Compile with Makefile
      run: |
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: os-image
        path: |
          *.img
          *.bin
          *.iso
          
